<!doctype html>
<meta charset="utf-8">
<title>RPGUP — fixture de teste, sem Foundry real</title>
<link rel="stylesheet" href="/styles/module.css">
<style>
/* Emulate Theme V2 theme selection without depending on OS color preference.
   Foundry can select the theme at world level or for each ApplicationV2. */
body { position: fixed; display: flex; margin: 0; width: 100vw; height: 100vh; font-family: sans-serif; background: #30343d; color: #eee; --color-text-primary: #f4f1ed; --color-text-secondary: #c7c0b5; }
body.theme-light { background: #e5dfd2; color: #282623; --color-text-primary: #282623; --color-text-secondary: #514b44; }
body.theme-light .application { background: #f3efe7; color: #282623; }
body.theme-light .window-header { background: #e4dccd; color: #282623; }
#interface { display: flex; flex: 1; position: relative; }
#ui-left { position: absolute; left: 0; }
#ui-right { position: absolute; right: 0; }
.application { position: absolute; background: #454b58; display: flex; flex-direction: column; }
.window-header { height: 30px; flex-shrink: 0; background: #252830; display: flex; justify-content: end; }
.window-title { flex: 1; padding: 5px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.window-header [data-action="toggleModuleSettings"]::before { content: "⚙"; }
.window-header [data-action="undock"]::before { content: "↗"; }
.window-header [data-action="reloadRoom"]::before { content: "↻"; }
.window-content { flex: 1; min-height: 0; }
input, select, button { font: inherit; }
</style>
<div id="interface"><div id="ui-left">Controles Foundry</div><div id="ui-right"><section id="settings" class="settings"><button type="button">Configurar opções</button></section></div></div>
<script type="module">
// A small documented-contract fixture. It does NOT emulate a complete Foundry runtime.
const handlers = new Map();
globalThis.Hooks = {
  on(name, fn) { const list = handlers.get(name) ?? []; list.push(fn); handlers.set(name, list); },
  once(name, fn) { this.on(name, fn); },
  callAll(name, ...args) { for (const fn of handlers.get(name) ?? []) fn(...args); }
};
const prefs = {};
const users = [
  { id: "gm1", name: "GM Teste", isGM: true, avatar: "users/avatar-gm.webp", color: "#d3a45a" },
  { id: "p1", name: "Jogador A", isGM: false, color: "#3399cc" },
  { id: "p2", name: "Jogador B", isGM: false, color: "#ee7788" }
].map(user => ({ ...user,
  getFlag() { return prefs[user.id] ?? JSON.parse(localStorage.getItem(`prefs-${user.id}`) ?? "null"); },
  async setFlag(scope, key, value) { prefs[user.id] = structuredClone(value); localStorage.setItem(`prefs-${user.id}`, JSON.stringify(value)); Hooks.callAll("updateUser", this, { flags: { [scope]: { [key]: value } } }); }
}));
let config = {
  roomId: "FixtureRoom123", extraQuery: "password=Fixture123", audio: "discord", directorUserId: "",
  slots: { gm1: "slot_gm", p1: "slot_a", p2: "slot_b" }
};
config = JSON.parse(localStorage.getItem("world-config") ?? "null") ?? config;
const registered = new Map();
const menus = new Map();
globalThis.notices = [];
globalThis.ui = { notifications: Object.fromEntries(["error", "warn", "info"].map(key => [key, value => notices.push({ key, value })])) };
globalThis.game = {
  user: users.find(user => user.id === new URL(location.href).searchParams.get("user")) ?? users[0], users,
  modules: new Map([["rpgup-vdo-ninja", {}]]),
  settings: {
    register(scope, key, value) { registered.set(key, value); },
    registerMenu(scope, key, value) { menus.set(key, value); },
    get() { return config; }, // Foundry returns the live Setting value, not a draft clone.
    async set(scope, key, value) {
      if (!game.user.isGM) throw new Error("World setting: GM required");
      if (fixture.failSave) throw new Error("Fixture: gravação recusada");
      config = structuredClone(value);
      localStorage.setItem("world-config", JSON.stringify(config));
      registered.get(key)?.onChange?.(config);
      return config;
    }
  }
};
window.addEventListener("storage", event => {
  if (event.key !== "world-config") return;
  config = JSON.parse(event.newValue);
  registered.get("world")?.onChange?.(config);
});
const applications = [];
class ApplicationV2 {
  constructor(options = {}) { this.options = { ...this.constructor.DEFAULT_OPTIONS, ...options }; this.position = { left: Math.max(8, (innerWidth - this.options.position.width) / 2), top: Math.max(8, (innerHeight - this.options.position.height) / 2), ...this.options.position }; applications.push(this); }
  async render(options = {}) {
    this._canRender(options);
    if (!this.element) {
      this.element = await this._renderFrame(options);
      this.element.id = this.options.id;
      this.element.className = `application ${this.options.classes.join(" ")}`;
      this.element.addEventListener("click", event => {
        const target = event.target.closest("button[data-action]");
        if (!target) return;
        if (target.dataset.action === "close") this.close();
        else this.options.actions?.[target.dataset.action]?.call(this, event, target);
      });
      document.body.append(this.element);
    }
    const result = await this._renderHTML({}, options);
    this._replaceHTML(result, this.element.querySelector(".window-content"), options);
    this.rendered = true;
    this.setPosition(this.position);
    await this._onRender({}, options);
    return this;
  }
  async _renderFrame() {
    const frame = document.createElement("div");
    frame.innerHTML = '<header class="window-header"><span class="window-title"></span><button type="button" data-action="close" aria-label="Fechar">×</button></header><div class="window-content"></div>';
    frame.querySelector(".window-title").textContent = this.options.window.title;
    return frame;
  }
  setPosition(position) {
    Object.assign(this.position, position);
    this._prePosition(this.position);
    for (const key of ["width", "height", "left", "top"]) this.element.style[key] = `${this.position[key]}px`;
    this._onPosition(this.position);
  }
  async close() { await this._preClose({}); this.element.remove(); this.element = null; this.rendered = false; this._onClose({}); }
  bringToFront() { this.frontCount = (this.frontCount ?? 0) + 1; }
  _canRender() {}
  async _onRender() {}
  _prePosition() {}
  _onPosition() {}
  async _preClose() {}
  _onClose() {}
}
globalThis.foundry = { applications: { api: { ApplicationV2 } } };
await import("/src/main.js");
Hooks.callAll("init");
Hooks.callAll("renderSettings", {}, document.querySelector("#settings"));
Hooks.callAll("ready");
globalThis.fixture = {
  config: () => structuredClone(config),
  menu: key => new (menus.get(key).type)().render({ force: true }),
  async closeConfig() { for (const app of applications) if (app.rendered && app.options.id === "rpgup-vdo-world-config") await app.close(); },
  async dock() { return (await import("/src/room-dock.js")).RoomDock.instance; },
  async setConfig(value) { return game.settings.set("rpgup-vdo-ninja", "world", value); }
};
globalThis.fixtureReady = true;
</script>
